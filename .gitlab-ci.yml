stages: [test, mirror]
default:
  tags: [dind]
  image: mirror.gcr.io/library/python:3.11-slim-bookworm
variables:
  GIT_DEPTH: "0"
  UV_CACHE_DIR: $CI_PROJECT_DIR/.ci-uv/cache
  UV_PYTHON: python3.11
  UV_PYTHON_DOWNLOADS: never
test:
  stage: test
  cache:
    key:
      prefix: mini-capp-linux-x86-64-python311-uv-0.13.10
      files: [uv.lock]
    paths: [.ci-uv/]
  script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - mkdir -p .ci-uv/bin
    - |
      if [ ! -x .ci-uv/bin/uv ]; then
        python -m pip install --no-index --no-deps --timeout 20 --retries 2 'https://files.pythonhosted.org/packages/8b/99/fad906311e48fce22e4db71ee4c3df29bdb17b29eb36878f52b8dcd79237/uv-0.13.10-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=7cc9c41b43d583e34c781fd3446405b06e9c5fa2db468ce2a534d353db6429e5'
        cp "$(command -v uv)" .ci-uv/bin/uv
      fi
      export PATH="$CI_PROJECT_DIR/.ci-uv/bin:$PATH"
    - uv sync --frozen
    - uv run --frozen pytest -q
    - uv run --frozen python tools/package_plugin.py
    - git diff --exit-code -- plugin/runtime.json plugin/tools.json
  artifacts:
    expire_in: 1 day
    paths:
      - .ci-uv/
mirror:github:
  stage: mirror
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - python tools/mirror_github.py
test:plugin:
  stage: test
  image: mirror.gcr.io/library/node:24-bookworm-slim
  needs:
    - job: test
      artifacts: true
  variables:
    UV_OFFLINE: "1"
  script:
    - apt-get update && apt-get install -y --no-install-recommends git python3
    - export PATH="$CI_PROJECT_DIR/.ci-uv/bin:$PATH"
    - cd plugin
    - npm ci --ignore-scripts --no-audit --no-fund
    - npm run typecheck
    - npm test
