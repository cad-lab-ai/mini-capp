stages: [test, mirror]
default:
  tags: [dind]
  image: mirror.gcr.io/library/python:3.12-slim
variables:
  GIT_DEPTH: "0"
test:
  stage: test
  script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - pip install uv
    - uv sync --frozen
    - uv run --frozen pytest -q
    - uv run --frozen python tools/package_plugin.py
    - git diff --exit-code -- plugin/runtime.json plugin/tools.json
mirror:github:
  stage: mirror
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - python tools/mirror_github.py
test:plugin:
  stage: test
  image: mirror.gcr.io/library/node:24-bookworm-slim
  script:
    - apt-get update && apt-get install -y --no-install-recommends git python3 python3-pip
    - pip3 install --break-system-packages uv
    - cd plugin
    - npm ci --ignore-scripts --no-audit --no-fund
    - npm run typecheck
    - npm test
