[project]
name = "cad-lab-process-planning"
version = "0.1.0"
description = "Agent-oriented process planning and production catalog MCP service"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2", "pydantic>=2.10,<3"]

[project.scripts]
process-planning = "process_planning.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/process_planning"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
