[project]
name = "cad-lab-mini-capp"
version = "0.1.0"
description = "mini CAPP: demonstration CAPP for enterprise AI workflows and tailored integration"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2", "pydantic>=2.10,<3"]

[project.scripts]
mini-capp = "process_planning.server:main"
process-planning = "process_planning.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/process_planning"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
